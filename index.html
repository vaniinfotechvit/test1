<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Task App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Simple Task App</h1>
    <p class="subtitle">A browser-only app for GitHub Actions practice.</p>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="Enter a task" required />
      <button type="submit">Add Task</button>
    </form>

    <ul id="task-list"></ul>
    <p id="empty-state">No tasks yet. Add one above.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
